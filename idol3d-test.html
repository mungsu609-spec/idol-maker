<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 아이돌 무대 시험</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:linear-gradient(#e6efff,#fdeef6);color:#4a2f3c}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-family:Jua,sans-serif;font-weight:400;text-align:center;color:#ef5c96;margin:4px 0}
.stage{position:relative;border-radius:16px;overflow:hidden;border:3px solid #e3ad4a;background:radial-gradient(ellipse at 50% 15%,#7a52c0,#2a1850 62%,#140b28)}
.stage canvas{width:100%;aspect-ratio:16/9;display:block}
.lights{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 60px,rgba(255,255,255,.05) 60px 90px)}
#msg{position:absolute;left:0;right:0;top:45%;text-align:center;color:#fff;font-family:Jua,sans-serif}
.card{background:#fffaf0;border:3px solid #e3ad4a;border-radius:16px;padding:10px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{font-family:Jua,sans-serif;border:2px solid #e3ad4a;background:linear-gradient(#fffdf6,#ffe9b8);border-radius:999px;padding:5px 12px;font-size:15px;cursor:pointer}
.chip.on{background:linear-gradient(#ffa8cb,#ef5c96);border-color:#c23c74;color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #c9a070;cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px #ef5c96}
label{font-family:Jua,sans-serif;color:#8a3a62}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.faces img{width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3ad4a;background:radial-gradient(#fff,#ffd6e8);cursor:pointer}
.faces img.on{box-shadow:0 0 0 3px #ef5c96}
p.muted{color:#8a6f7a;font-size:13px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.4/lib/three-vrm.module.min.js"}}</script>
</head>
<body>
<main>
<h1>🎤 3D 아이돌 무대 시험</h1>
<div class="stage"><canvas id="cv"></canvas><div class="lights"></div><div id="msg">무대 준비 중… (처음엔 10초쯤 걸려요)</div></div>
<div class="card">
  <label>동작</label><div class="chips" id="modes"></div>
  <label>멤버 (누르면 꾸미기)</label><div class="faces" id="faces"></div>
</div>
<div class="card" id="cust"></div>
<p class="muted">✅ 0원: three.js + pixiv three-vrm(오픈소스) + VRoid 공식 샘플 캐릭터(CC0). 진짜 3D라 팔다리가 이음새 없이 휘고, 눈 깜빡임·입 모양·표정이 있어요. 머리색·옷 색·고양이 귀와 꼬리를 바꿀 수 있어요. 아래 얼굴 사진도 3D 캐릭터를 바로 찍은 거예요.</p>
</main>
<script type="module">
import { createStage, snapshot, MODELS } from './idol3d.js';
const HAIR = [null, '#2b2328', '#8a5a40', '#e2b878', '#f08ab4', '#c7c9dc', '#6a8ee0', '#c8404a', '#9a72d8', '#f0a050'];
const CLOTH = [null, '#ffffff', '#2a2a33', '#ff8fb8', '#8ad0f0', '#f2d24b', '#b49ae8', '#e0384f', '#7ac47a'];
const MODES = { idle: '대기', dance: '춤', cheer: '만세', wave: '손 흔들기', bow: '인사', sleep: '졸기', sad: '시무룩' };
const EXPS = { '': '자동', happy: '웃음', surprised: '놀람', angry: '화남', sad: '슬픔', relaxed: '편안' };
let team = [
  { name: '하린', model: 'AvatarSample_G', hair: null, cloth: null, cat: false },
  { name: '유나', model: 'HairSample_Female', hair: null, cloth: null, cat: false },
  { name: '서아', model: 'AvatarSample_D', hair: '#f08ab4', cloth: null, cat: true },
  { name: '지우', model: 'Sendagaya_Shino', hair: null, cloth: '#ffffff', cat: false },
  { name: '채원', model: 'AvatarSample_F', hair: null, cloth: null, cat: false },
];
let sel = 0, mode = 'dance';
const stage = createStage(document.getElementById('cv'));
const $ = s => document.querySelector(s);
async function refresh(all) {
  $('#msg').style.display = ''; $('#msg').textContent = '무대 준비 중…';
  await stage.setMembers(team.map(m => ({ ...m, exp: m.exp || null })));
  stage.setMode(mode); $('#msg').style.display = 'none';
  if (all) for (let i = 0; i < team.length; i++) team[i].face = await snapshot(team[i], 'face', 160);
  else team[sel].face = await snapshot(team[sel], 'face', 160);
  ui();
}
function ui() {
  $('#modes').innerHTML = Object.entries(MODES).map(([k, v]) => `<button class="chip${mode === k ? ' on' : ''}" data-m="${k}">${v}</button>`).join('');
  $('#faces').innerHTML = team.map((m, i) => `<img src="${m.face || ''}" class="${i === sel ? 'on' : ''}" data-s="${i}" alt="${m.name}" title="${m.name}">`).join('');
  const m = team[sel];
  $('#cust').innerHTML = `<label>🎀 ${m.name} 꾸미기</label>
<div class="chips">${MODELS.girl.map(([id, nm]) => `<button class="chip${m.model === id ? ' on' : ''}" data-model="${id}">${nm}</button>`).join('')}</div>
<label>머리색</label><div class="sw">${HAIR.map((c, i) => `<button class="${m.hair === c ? 'on' : ''}" style="background:${c || 'conic-gradient(#f08ab4,#e2b878,#6a8ee0,#f08ab4)'}" data-hair="${i}" aria-label="머리색 ${i}"></button>`).join('')}</div>
<label>옷 색</label><div class="sw">${CLOTH.map((c, i) => `<button class="${m.cloth === c ? 'on' : ''}" style="background:${c || 'conic-gradient(#ff8fb8,#8ad0f0,#f2d24b,#ff8fb8)'}" data-cloth="${i}" aria-label="옷 색 ${i}"></button>`).join('')}</div>
<label>고양이 귀·꼬리</label><div class="chips"><button class="chip${!m.cat ? ' on' : ''}" data-cat="0">없음</button><button class="chip${m.cat ? ' on' : ''}" data-cat="1">달기 🐱</button></div>
<label>표정</label><div class="chips">${Object.entries(EXPS).map(([k, v]) => `<button class="chip${(m.exp || '') === k ? ' on' : ''}" data-exp="${k}">${v}</button>`).join('')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-m],[data-s],[data-model],[data-hair],[data-cloth],[data-cat],[data-exp]'); if (!b) return;
  const d = b.dataset, m = team[sel];
  if (d.m) { mode = d.m; stage.setMode(mode); return ui(); }
  if (d.s) { sel = +d.s; return ui(); }
  if (d.model) m.model = d.model;
  else if (d.hair !== undefined) m.hair = HAIR[+d.hair];
  else if (d.cloth !== undefined) m.cloth = CLOTH[+d.cloth];
  else if (d.cat !== undefined) m.cat = d.cat === '1';
  else if (d.exp !== undefined) m.exp = d.exp || null;
  refresh(false);
});
if (location.hash.length > 1) mode = location.hash.slice(1);
ui(); refresh(true);
</script>
</body>
</html>
